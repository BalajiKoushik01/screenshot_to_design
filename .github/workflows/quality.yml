name: Backend syntax and frontend build
on:
  pull_request:
  push:
    branches: ["fix/**"]
jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q loom-backend/app
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loom-backend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: loom-backend/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
